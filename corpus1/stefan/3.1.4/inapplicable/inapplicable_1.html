    <h1>The Little Red Hen</h1>
    <p>Once upon a time, there was a little red hen who lived on a farm.</p>
    <p>One day she found some wheat seeds and asked her friends to help her plant them.</p>
    <p>"Not I," said the dog. "Not I," said the cat. "Not I," said the pig.</p>
    <p>"Then I will do it myself," said the little red hen.</p>
