<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.2.2 | PASS | Personas: Stefan (ADHD/dyslexia), Elias (low vision/tremor)
     Auto-playing banner has visible, keyboard-accessible Pause button. -->
<head><meta charset="utf-8"><title>Homepage</title>
<style>
  @keyframes slide { 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }
  .banner { overflow:hidden; width:100%; }
  .banner-inner { animation: slide 8s linear infinite; white-space:nowrap; }
  .banner-inner.paused { animation-play-state: paused; }
</style>
<script>
function toggleBanner() {
  const b = document.querySelector('.banner-inner');
  const btn = document.getElementById('pause-btn');
  if (b.classList.contains('paused')) {
    b.classList.remove('paused'); btn.textContent = 'Pause banner';
  } else {
    b.classList.add('paused'); btn.textContent = 'Resume banner';
  }
}
</script></head>
<body>
  <div class="banner">
    <div class="banner-inner">Breaking: New accessibility standards announced · Free webinar this Friday ·</div>
  </div>
  <button id="pause-btn" onclick="toggleBanner()">Pause banner</button>
  <main><h1>Welcome</h1></main>
</body>
</html>
