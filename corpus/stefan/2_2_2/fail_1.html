<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.2.2 | FAIL | Personas: Stefan (ADHD/dyslexia), Elias (low vision/tremor)
     Auto-playing carousel has no pause/stop control. Runs indefinitely.
     Severity for Stefan: CRITICAL - constant motion prevents reading and focus.
     Severity for Elias: SERIOUS - cannot stop motion to use screen magnifier. -->
<head><meta charset="utf-8"><title>Promotional Carousel</title>
<style>
  @keyframes carousel { 0%{opacity:1} 33%{opacity:0} 66%{opacity:0} 100%{opacity:1} }
  .slide { position:absolute; top:0; left:0; width:100%; animation: carousel 9s infinite; }
  .slide:nth-child(2) { animation-delay: 3s; }
  .slide:nth-child(3) { animation-delay: 6s; }
  .carousel { position:relative; height:200px; overflow:hidden; }
</style></head>
<body>
  <div class="carousel" aria-label="Promotions">
    <div class="slide" style="background:#e8f4fd"><h2>50% off all shoes</h2></div>
    <div class="slide" style="background:#fef9e7"><h2>Free shipping over $50</h2></div>
    <div class="slide" style="background:#eafaf1"><h2>New arrivals weekly</h2></div>
  </div>
  <main><h1>Our Products</h1></main>
</body>
</html>
