<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.2.2 | PASS | Personas: Stefan (ADHD/dyslexia), Elias (low vision/tremor)
     CSS animation respects prefers-reduced-motion media query. Stops for users with OS setting. -->
<head><meta charset="utf-8"><title>Loading Indicator</title>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 40px; height: 40px; border: 4px solid #ccc;
             border-top-color: #0066cc; border-radius: 50%;
             animation: spin 1s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: #0066cc; }
  }
</style></head>
<body>
  <div role="status" aria-live="polite" aria-label="Loading content, please wait">
    <div class="spinner"></div>
  </div>
</body>
</html>
