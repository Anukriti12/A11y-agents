<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.4.12 | FAIL | Personas: Stefan (ADHD/dyslexia), Elias (low vision)
     Fixed-height container clips text when line-height is increased.
     When user applies 1.5x line-height override, text overflows and is cut off.
     Severity for Stefan: SERIOUS - reading override tools cause content loss.
     Severity for Elias: SERIOUS - screen magnifier + font modifier breaks layout. -->
<head><meta charset="utf-8"><title>Event Card</title>
<style>
  .event-card { height: 80px; overflow: hidden; border: 1px solid #ccc; padding: 8px; width: 300px; }
  .event-title { line-height: 1.2; font-size: 16px; }
</style></head>
<body>
  <div class="event-card">
    <p class="event-title">Annual Accessibility Conference — Improving Digital Inclusion for
    Everyone, Everywhere in 2025</p>
    <p class="event-date">March 15, 2025 · San Francisco</p>
  </div>
</body>
</html>
