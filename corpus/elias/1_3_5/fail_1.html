<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.3.5 | FAIL | Personas: Ian (autism), Elias (tremor), Sophie (cognitive)
     Personal data fields have no autocomplete attributes. Browser cannot autofill.
     Severity for Elias: CRITICAL - tremor makes manual typing extremely difficult.
     Severity for Ian: SERIOUS - must recall and type personal info manually.
     Severity for Sophie: SERIOUS - cognitive load of remembering account details. -->
<head><meta charset="utf-8"><title>Profile Setup</title></head>
<body>
  <h1>Create Your Profile</h1>
  <form>
    <label for="fn">First name</label>
    <input id="fn" type="text" name="firstname"><br>
    <label for="ln">Last name</label>
    <input id="ln" type="text" name="lastname"><br>
    <label for="em">Email</label>
    <input id="em" type="text" name="email"><br>
    <label for="ph">Phone number</label>
    <input id="ph" type="text" name="phone"><br>
    <button type="submit">Save profile</button>
  </form>
</body>
</html>
