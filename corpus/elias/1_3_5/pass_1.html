<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.3.5 | PASS | Personas: Ian (autism), Elias (tremor), Sophie (cognitive)
     All personal data fields have correct autocomplete tokens. Browser can autofill. -->
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
  <h1>Shipping Address</h1>
  <form>
    <label for="fname">First name</label>
    <input id="fname" type="text" autocomplete="given-name"><br>
    <label for="lname">Last name</label>
    <input id="lname" type="text" autocomplete="family-name"><br>
    <label for="addr">Street address</label>
    <input id="addr" type="text" autocomplete="street-address"><br>
    <label for="city">City</label>
    <input id="city" type="text" autocomplete="address-level2"><br>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email"><br>
    <label for="phone">Phone</label>
    <input id="phone" type="tel" autocomplete="tel"><br>
    <button type="submit">Continue to payment</button>
  </form>
</body>
</html>
