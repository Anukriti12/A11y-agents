<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.3.5 | INAPPLICABLE | Personas: Ian (autism), Elias (tremor), Sophie (cognitive)
     Form collects no personal data. Only a search query. Criterion does not apply. -->
<head><meta charset="utf-8"><title>Search</title></head>
<body>
  <form role="search">
    <label for="q">Search our catalogue</label>
    <input id="q" type="search" name="q" placeholder="e.g. running shoes">
    <button type="submit">Search</button>
  </form>
</body>
</html>
