<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.3.5 | PASS | Personas: Ian (autism), Elias (tremor), Sophie (cognitive)
     Credit card form uses payment autocomplete tokens. -->
<head><meta charset="utf-8"><title>Payment</title></head>
<body>
  <h1>Payment Details</h1>
  <form>
    <label for="ccname">Name on card</label>
    <input id="ccname" type="text" autocomplete="cc-name"><br>
    <label for="ccnum">Card number</label>
    <input id="ccnum" type="text" autocomplete="cc-number"><br>
    <label for="ccexp">Expiry date</label>
    <input id="ccexp" type="text" autocomplete="cc-exp"><br>
    <button type="submit">Pay now</button>
  </form>
</body>
</html>
