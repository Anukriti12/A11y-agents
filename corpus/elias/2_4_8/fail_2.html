<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.4.8 | FAIL | SYNTHETIC | Persona: Elias (low vision, short-term memory loss)
     All pages in the multi-step wizard share the same generic title "Wizard".
     Active nav item is only shown via color (no text/underline/weight change).
     Severity: SERIOUS - color alone is insufficient for low-vision users. -->
<head><meta charset="utf-8">
<title>Wizard</title>
<style>
  nav a { color: #999; }
  nav a.active { color: #ff4500; } /* color-only differentiation */
</style>
</head>
<body>
  <nav aria-label="Wizard steps">
    <a href="/wizard/1">Account</a>
    <a href="/wizard/2">Profile</a>
    <a href="/wizard/3" class="active">Address</a>
    <a href="/wizard/4">Confirm</a>
  </nav>
  <main>
    <h1>Enter Your Address</h1>
    <form>
      <label for="addr">Street</label>
      <input id="addr" type="text" autocomplete="street-address">
      <button type="submit">Next step</button>
    </form>
  </main>
</body>
</html>
