<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.2.2 | INAPPLICABLE | Personas: Stefan (ADHD/dyslexia), Elias (low vision/tremor)

<head><meta charset="utf-8"><title>Patient Intake Form</title></head>
<body>
  <h1>Patient Information Form</h1>
  <form>
    <label for="dob">Date of birth</label>
    <input id="dob" type="date" autocomplete="bday">
    <label for="condition">Primary concern</label>
    <textarea id="condition" rows="4"></textarea>
    <button type="submit">Submit form</button>
  </form>
</body>
