<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.4.6 | PASS | Persona: Elias (low vision)
     Normal text has 7:1+ contrast ratio (black #000 on white #fff = 21:1).
     Large text has 4.5:1+ contrast ratio. AAA thresholds met. -->
<head><meta charset="utf-8"><title>Medical Record</title>
<style>
  body { background: #ffffff; color: #000000; font-family: Arial, sans-serif; font-size: 16px; }
  h1 { color: #000000; font-size: 24px; } /* 21:1 ratio, AAA */
  .note { color: #1a1a1a; } /* near-black, >20:1 ratio */
</style></head>
<body>
  <h1>Patient Summary</h1>
  <p class="note">Next appointment: March 15, 2025 at 10:30 AM</p>
  <p>Please bring all current medications to your appointment.</p>
</body>
</html>
