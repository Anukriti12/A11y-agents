<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.4.6 | PASS | Persona: Elias (low vision)
     Dark background with near-white text. Both normal and large text meet AAA.
     #ffffff on #1a237e → contrast ratio ≈ 14.7:1 (AAA normal text ≥7:1). -->
<head><meta charset="utf-8"><title>Accessible Dashboard</title>
<style>
  .header { background: #1a237e; color: #ffffff; padding: 16px; }
  .header h1 { font-size: 28px; margin: 0; color: #ffffff; }
  .header p { color: #e8eaf6; margin: 4px 0 0; }
</style></head>
<body>
  <div class="header">
    <h1>User Dashboard</h1>
    <p>Welcome back, Elias. Last login: Today at 9:14 AM</p>
  </div>
  <main><p>Loading your data...</p></main>
</body>
</html>
