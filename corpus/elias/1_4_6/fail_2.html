<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.4.6 | FAIL | Persona: Elias (low vision)
     Placeholder text uses #aaaaaa on white = 2.32:1 ratio. Fails AA and AAA.
     While placeholder is not body text, screen magnifier users rely on it heavily.
     Severity: SERIOUS - Elias cannot read field hints when zoomed in. -->
<head><meta charset="utf-8"><title>Search Form</title>
<style>
  input::placeholder { color: #aaaaaa; }
  input { border: 1px solid #cccccc; padding: 8px; font-size: 16px; width: 300px; }
</style></head>
<body>
  <h1>Find a Doctor</h1>
  <form>
    <label for="specialty">Search by specialty</label><br>
    <input id="specialty" type="text" placeholder="e.g. Cardiologist, Dermatologist">
    <button type="submit">Search</button>
  </form>
</body>
</html>
