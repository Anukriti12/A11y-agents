<!DOCTYPE html>
<html lang="en">
<!-- WCAG 3.3.2 | PASS | SYNTHETIC | Persona: Ade (limited mobility, voice control)
     Password field has clear format instructions before the user begins typing.
     Required fields are marked with visible indicator and explained in a legend. -->
<head><meta charset="utf-8"><title>Create Account</title>
<style>
  .required-note { font-size: 14px; color: #555; margin-bottom: 1em; }
  label .required { color: #c0392b; }
</style></head>
<body>
  <h1>Create Your Account</h1>
  <p class="required-note">Fields marked with <span style="color:#c0392b">*</span> are required.</p>
  <form>
    <label for="username">
      Username <span class="required" aria-label="required">*</span>
    </label>
    <input id="username" type="text" required autocomplete="username"
           aria-describedby="username-hint">
    <p id="username-hint" style="font-size:14px;color:#555">
      5–20 characters. Letters and numbers only.
    </p>

    <label for="pw">
      Password <span class="required" aria-label="required">*</span>
    </label>
    <input id="pw" type="password" required autocomplete="new-password"
           aria-describedby="pw-hint">
    <p id="pw-hint" style="font-size:14px;color:#555">
      At least 8 characters. Must include one number and one symbol (e.g. ! @ # $).
    </p>

    <button type="submit">Create account</button>
  </form>
</body>
</html>
