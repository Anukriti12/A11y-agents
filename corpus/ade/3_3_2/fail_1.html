<!DOCTYPE html>
<html lang="en">
<!-- WCAG 3.3.2 | FAIL | SYNTHETIC | Persona: Ade (limited mobility, voice control)
     Form uses placeholder text instead of visible labels. Placeholder disappears on focus.
     Severity for Ade: CRITICAL - voice control requires visible label text to activate fields.
     When placeholder disappears after typing begins, Ade has no way to know which field is active. -->
<head><meta charset="utf-8"><title>Contact Form</title>
<style>
  input, textarea {
    width: 300px; padding: 10px; border: 1px solid #ccc;
    font-size: 16px; margin-bottom: 12px; display: block;
  }
  /* No labels — only placeholders -->
</style></head>
<body>
  <h1>Get in Touch</h1>
  <form>
    <input type="text" placeholder="Your name" autocomplete="name">
    <input type="email" placeholder="Email address" autocomplete="email">
    <input type="tel" placeholder="Phone (optional)" autocomplete="tel">
    <textarea rows="5" placeholder="Your message"></textarea>
    <button type="submit">Send</button>
  </form>
</body>
</html>
