<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.4.7 | FAIL | Persona: Ade (limited mobility, keyboard-only)
     All focus outlines removed with outline:none and no replacement.
     Severity for Ade: CRITICAL - cannot tell which element is active.
     Physical effort wasted tabbing to unknown location. -->
<head><meta charset="utf-8"><title>Modern-looking Site</title>
<style>
  * { outline: none; }
  a { color: #0066cc; text-decoration: none; }
  button { border: none; background: #0066cc; color: white; padding: 10px 20px; cursor: pointer; }
</style></head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/products">Products</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
  </nav>
  <main>
    <h1>Welcome to Our Site</h1>
    <button>Shop Now</button>
    <button>Learn More</button>
  </main>
</body>
</html>
