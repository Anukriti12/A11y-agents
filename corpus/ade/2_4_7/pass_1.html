<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.4.7 | PASS | Persona: Ade (limited mobility, keyboard-only)
     All interactive elements have visible, high-contrast focus indicators.
     Ade knows exactly which element is active at all times. -->
<head><meta charset="utf-8"><title>Navigation</title>
<style>
  a:focus, button:focus {
    outline: 3px solid #005fcc;
    outline-offset: 2px;
    border-radius: 2px;
  }
  a { color: #0044aa; }
</style></head>
<body>
  <nav aria-label="Main navigation">
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
  </nav>
  <main>
    <h1>Welcome</h1>
    <button type="button">Get started</button>
  </main>
</body>
</html>
