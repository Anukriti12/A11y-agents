<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.1.1 | PASS | Personas: Lakshmi (blind), Ade (limited mobility)
     Custom accordion is keyboard operable using Enter/Space to expand. -->
<head><meta charset="utf-8"><title>Help Center</title>
<script>
function togglePanel(btn) {
  const panel = document.getElementById(btn.getAttribute('aria-controls'));
  const expanded = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', !expanded);
  panel.hidden = expanded;
}
</script></head>
<body>
  <h1>Help Topics</h1>
  <button aria-expanded="false" aria-controls="panel1"
          onclick="togglePanel(this)" onkeydown="if(event.key==='Enter'||event.key===' ')togglePanel(this)">
    Account Settings
  </button>
  <div id="panel1" hidden>
    <p>Manage your profile, password, and notification preferences.</p>
  </div>
</body>
</html>
