<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.2.1 | FAIL | Personas: Ade (limited mobility), Sophie (cognitive/reading)
     Page uses meta refresh to redirect after 30 seconds with no warning or way to extend.
     Severity for Ade: CRITICAL - slow keyboard navigation means she rarely completes tasks in time.
     Severity for Sophie: CRITICAL - reading speed is slower; form data is lost. -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="30; url=/session-expired">
  <title>Complete Your Order</title>
</head>
<body>
  <h1>Order Review</h1>
  <p>Please review your order before confirming.</p>
  <table>
    <tr><th>Item</th><th>Price</th></tr>
    <tr><td>Ergonomic Keyboard</td><td>$89.99</td></tr>
  </table>
  <form>
    <button type="submit">Confirm order</button>
  </form>
</body>
</html>
