<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.2.1 | FAIL | Personas: Ade (limited mobility), Sophie (cognitive/reading)
     Countdown timer expires with no keyboard-accessible extension mechanism.
     Severity: SERIOUS - extend button only visible on hover (mouse-only). -->
<head><meta charset="utf-8"><title>Flash Sale</title>
<style>
  .extend-btn { display: none; }
  .timer-area:hover .extend-btn { display: inline-block; }
</style></head>
<body>
  <h1>Flash Sale</h1>
  <div class="timer-area">
    <p>Offer expires in: <span id="timer">00:05:00</span></p>
    <button class="extend-btn" type="button">Extend offer (hover only)</button>
  </div>
  <form>
    <label for="qty">Quantity</label>
    <input id="qty" type="number" min="1" max="10">
    <button type="submit">Buy now</button>
  </form>
</body>
</html>
