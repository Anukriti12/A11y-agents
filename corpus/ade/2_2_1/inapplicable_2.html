<body>
  <h1>Accessibility Glossary</h1>
  <dl>
    <dt>WCAG</dt>
    <dd>Web Content Accessibility Guidelines. Standards for making web content accessible.</dd>
    <dt>ARIA</dt>
    <dd>Accessible Rich Internet Applications. A set of roles and attributes for accessibility.</dd>
    <dt>AT</dt>
    <dd>Assistive Technology. Tools like screen readers and switch interfaces.</dd>
  </dl>
