<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.2.1 | PASS | Personas: Ade (limited mobility), Sophie (cognitive/reading)
     No time limit is enforced. User can take as long as needed. -->
<head><meta charset="utf-8"><title>Benefits Application</title></head>
<body>
  <h1>Benefits Application Form</h1>
  <p>Take as much time as you need. Your progress is saved automatically.</p>
  <form>
    <fieldset>
      <legend>Personal Information</legend>
      <label for="fname">First name</label>
      <input id="fname" type="text" autocomplete="given-name"><br>
      <label for="lname">Last name</label>
      <input id="lname" type="text" autocomplete="family-name"><br>
    </fieldset>
    <button type="submit">Save and continue</button>
  </form>
</body>
</html>
