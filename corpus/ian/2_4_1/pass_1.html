<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.4.1 | PASS | Personas: Lakshmi (blind), Ade (limited mobility)
     Skip-to-main link is first focusable element. Moves focus to <main>. -->
<head><meta charset="utf-8"><title>News Website</title>
<style>
  .skip-link { position: absolute; transform: translateY(-100%); }
  .skip-link:focus { transform: translateY(0); background: #000; color: #fff; padding: 8px; }
</style></head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header>
    <nav aria-label="Primary navigation">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/world">World</a></li>
        <li><a href="/tech">Technology</a></li>
        <li><a href="/sports">Sports</a></li>
      </ul>
    </nav>
  </header>
  <main id="main-content">
    <h1>Latest Headlines</h1>
    <p>Today's top stories from around the world.</p>
  </main>
</body>
</html>
