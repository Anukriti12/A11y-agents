<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.3.1 | PASS | Persona: Ian (autism)
     Headings are sequential, lists use proper markup, table has headers with scope.
     Predictable structure is essential for Ian to navigate without disorientation. -->
<head><meta charset="utf-8"><title>Course Catalog</title></head>
<body>
  <main>
    <h1>Spring Course Catalog</h1>
    <h2>Computer Science</h2>
    <ul>

    </ul>
    <h2>Design</h2>
    <ul>
      <li>DES110 - Visual Communication</li>
    </ul>
    <h2>Enrollment Summary</h2>
    <table>
      <caption>Spring 2025 Enrollment by Department</caption>
      <thead>
        <tr>
          <th scope="col">Department</th>
          <th scope="col">Courses</th>
          <th scope="col">Students</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Computer Science</td><td>12</td><td>380</td></tr>
        <tr><td>Design</td><td>8</td><td>210</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
