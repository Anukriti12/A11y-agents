<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.3.1 | FAIL | SYNTHETIC | Persona: Ian (autism)
     CSS animation flashes at 4Hz (4 full cycles per second) — exceeds 3Hz threshold.
     Severity for Ian: CRITICAL - rapid flashing causes severe sensory overload,
     anxiety, and in photosensitive individuals, seizure risk. -->
<head><meta charset="utf-8"><title>Attention Banner</title>
<style>
  @keyframes flash-danger {
    0%, 49% { background-color: #ff0000; }
    50%, 100% { background-color: #ffffff; }
  }
  /* Period = 250ms = 4Hz — EXCEEDS the 3Hz limit */
  .alert-banner {
    padding: 20px;
    font-size: 24px;
    font-weight: bold;
    color: #000;
    animation: flash-danger 250ms step-end infinite;
    width: 100%;
    text-align: center;
  }
</style></head>
<body>
  <div class="alert-banner" role="alert">
    ⚠️ LIMITED TIME OFFER — ENDS TONIGHT ⚠️
  </div>
  <main><h1>Flash Sale</h1></main>
</body>
</html>
