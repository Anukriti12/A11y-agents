    <h1>Classic Pancake Recipe</h1>
    <h2>Ingredients</h2>
    <ul>
      <li>1 cup flour</li>
      <li>1 tbsp sugar</li>
      <li>1 egg</li>
      <li>1 cup milk</li>
      <li>2 tbsp butter</li>
    </ul>
    <h2>Method</h2>
    <ol>
      <li>Mix dry ingredients in a bowl.</li>
      <li>Add wet ingredients and whisk until smooth.</li>
      <li>Cook on medium heat for 2 minutes per side.</li>
    </ol>
  </article>
