<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.2.1 | PASS | Personas: Ade (limited mobility), Sophie (cognitive/reading)
     Session warning appears before timeout with keyboard-accessible extend option. -->
<head><meta charset="utf-8"><title>Banking Portal</title>
<script>
// Simulates a session timeout warning at 19 minutes (with 1 min to respond)
function showTimeoutWarning() {
  document.getElementById('timeout-dialog').removeAttribute('hidden');
  document.getElementById('extend-btn').focus();
}
function extendSession() {
  document.getElementById('timeout-dialog').setAttribute('hidden', '');
  // Reset session timer
}
function logout() { window.location.href = '/logout'; }
</script></head>
<body>
  <main>
    <h1>Account Overview</h1>
    <p>Balance: $4,230.50</p>
  </main>
  <div id="timeout-dialog" role="alertdialog" aria-modal="true" 
       aria-labelledby="timeout-title" aria-describedby="timeout-desc" hidden>
    <h2 id="timeout-title">Session expiring soon</h2>
    <p id="timeout-desc">Your session will expire in 60 seconds due to inactivity.
       Would you like to continue?</p>
    <button id="extend-btn" onclick="extendSession()">Continue session</button>
    <button onclick="logout()">Sign out now</button>
  </div>
</body>
</html>
