<!DOCTYPE html>
<html lang="en">
<!-- WCAG 3.1.5 | INAPPLICABLE | SYNTHETIC | Persona: Sophie (Down syndrome, cognitive disability)
     Contact form only. Labels and button text are simple field names — no prose to evaluate. -->
<head><meta charset="utf-8"><title>Contact</title></head>
<body>
  <h1>Contact Us</h1>
  <form>
    <label for="name">Your name</label>
    <input id="name" type="text" autocomplete="name"><br>
    <label for="email">Your email</label>
    <input id="email" type="email" autocomplete="email"><br>
    <label for="msg">Your message</label>
    <textarea id="msg" rows="5"></textarea><br>
    <button type="submit">Send message</button>
  </form>
</body>
</html>
