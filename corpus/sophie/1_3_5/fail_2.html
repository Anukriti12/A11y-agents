<!DOCTYPE html>
<html lang="en">
<!-- WCAG 1.3.5 | FAIL | Personas: Ian (autism), Elias (tremor), Sophie (cognitive)
     Fields have autocomplete="off" which actively prevents browser autofill.
     Severity: CRITICAL - browser autofill is explicitly disabled. -->
<head><meta charset="utf-8"><title>Account Registration</title></head>
<body>
  <h1>Register</h1>
  <form autocomplete="off">
    <label for="reg-name">Full name</label>
    <input id="reg-name" type="text" autocomplete="off"><br>
    <label for="reg-email">Email address</label>
    <input id="reg-email" type="email" autocomplete="off"><br>
    <label for="reg-addr">Home address</label>
    <input id="reg-addr" type="text" autocomplete="off"><br>
    <button type="submit">Create account</button>
  </form>
</body>
</html>
