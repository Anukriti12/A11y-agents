<!DOCTYPE html>
<html lang="en">
<!-- WCAG 3.3.1 | FAIL | Persona: Sophie (cognitive/reading disability)
     Error message exists but is not associated with the field (no aria-describedby).
     Screen reader does not announce error when the field is focused.
     Severity: SERIOUS - Sophie must search the page to find which field has an error. -->
<head><meta charset="utf-8"><title>Login</title>
<style>
  .errors { background: #fce4e4; border: 1px solid #cc0000; padding: 12px; margin-bottom: 16px; }
</style></head>
<body>
  <h1>Sign In</h1>
  <div class="errors">
    <p>Incorrect username or password. Please try again.</p>
  </div>
  <form>
    <label for="user">Username</label>
    <input id="user" type="text" autocomplete="username"><br>
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password"><br>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
