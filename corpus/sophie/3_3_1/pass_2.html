<!DOCTYPE html>
<html lang="en">
<!-- WCAG 3.3.1 | PASS | Persona: Sophie (cognitive/reading disability)
     Server-side validation error is displayed in a summary at the top, programmatically
     associated with each field. NVDA announces error on focus. -->
<head><meta charset="utf-8"><title>Checkout Form</title></head>
<body>
  <h1>Delivery Information</h1>
  <div role="alert" aria-labelledby="error-heading">
    <h2 id="error-heading">Please fix 1 error before continuing</h2>
    <ul>
      <li><a href="#postcode">Postcode is not valid</a></li>
    </ul>
  </div>
  <form>
    <label for="postcode">Postcode</label>
    <input id="postcode" type="text" aria-describedby="postcode-err" aria-invalid="true">
    <p id="postcode-err" style="color:#c0392b">
      Enter a valid UK postcode, e.g. SW1A 1AA
    </p>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
