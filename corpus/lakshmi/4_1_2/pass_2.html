<!DOCTYPE html>
<html lang="en">
<!-- WCAG 4.1.2 | PASS | Persona: Lakshmi (blind, screen reader)
     Custom checkbox widget exposes role, state, and label via ARIA.
     NVDA announces "Subscribe to newsletter, checkbox, checked". -->
<head><meta charset="utf-8"><title>Newsletter Signup</title></head>
<body>
  <div role="checkbox" aria-checked="true" aria-label="Subscribe to newsletter"
       tabindex="0" id="subscribe">
    <span class="checkmark">✓</span> Subscribe to newsletter
  </div>
</body>
</html>
