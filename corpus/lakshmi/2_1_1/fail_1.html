<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.1.1 | FAIL | Personas: Lakshmi (blind), Ade (limited mobility)
     Drag-and-drop reorder has no keyboard alternative.
     Severity for Ade: CRITICAL - cannot reorder items without a mouse.
     Severity for Lakshmi: CRITICAL - no interaction available at all. -->
<head><meta charset="utf-8"><title>Task Manager</title>
<style>.task { cursor: grab; padding: 8px; margin: 4px; background: #f0f0f0; }</style></head>
<body>
  <h1>My Tasks</h1>
  <p>Drag tasks to reorder them.</p>
  <div id="task-list">
    <div class="task" draggable="true" ondragstart="drag(event)" id="t1">Write report</div>
    <div class="task" draggable="true" ondragstart="drag(event)" id="t2">Send email</div>
    <div class="task" draggable="true" ondragstart="drag(event)" id="t3">Review PR</div>
  </div>
</body>
</html>
