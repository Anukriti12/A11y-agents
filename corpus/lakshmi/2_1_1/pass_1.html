<!DOCTYPE html>
<html lang="en">
<!-- WCAG 2.1.1 | PASS | Personas: Lakshmi (blind), Ade (limited mobility)
     All interactive elements are keyboard accessible. No focus traps. -->
<head><meta charset="utf-8"><title>Course Registration</title></head>
<body>
  <main>
    <h1>Register for Course</h1>
    <form>
      <label for="course">Select course</label>
      <select id="course" name="course">
        <option value="a11y">Web Accessibility</option>
        <option value="html">HTML Fundamentals</option>
      </select>
      <label for="name">Full name</label>
      <input id="name" type="text" autocomplete="name">
      <button type="submit">Register</button>
    </form>
  </main>
</body>
</html>
